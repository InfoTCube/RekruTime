# Builds the production image on every push to main → ghcr.io/infotcube/rekrutime:latest (+ :sha-<commit>).
# The server updates with: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/infotcube/rekrutime:latest
            ghcr.io/infotcube/rekrutime:sha-${{ github.sha }}
