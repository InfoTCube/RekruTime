# Local development database. Credentials match appsettings.Development.json.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rekrutime
      POSTGRES_USER: rekrutime
      POSTGRES_PASSWORD: rekrutime
    ports:
      - "5440:5432"  # 5440 on host: avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches every e-mail the app sends in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI

volumes:
  pgdata:
